<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Easy Switch</title>
    <style type="text/css">
      body {
        margin: 0;
        color: #292d32;
        background: #f4f5f6;
        font-family: system-ui, sans-serif;
        line-height: 1.45;
      }

      #save {
        display: block;
        min-height: 38px;
        margin: 16px auto 28px;
        padding: 0 28px;
        border: 1px solid #343a40;
        border-radius: 6px;
        background: #3b4148;
        color: #ffffff;
        font: 600 14px system-ui, sans-serif;
        cursor: pointer;
        transition: background-color 0.15s, box-shadow 0.15s;
      }

      #save:hover {
        background: #292f35;
      }

      #save:active {
        background: #20252a;
      }

      #container {
        margin: 40px auto 20px auto;
        width: min(940px, calc(100% - 24px));
        box-sizing: border-box;
        padding: 20px 30px 30px 30px;
        border: 1px solid #dedfe1;
        border-radius: 8px;
        background: #ffffff;
      }

      #container hr {
        border: 0;
        border-top: 1px solid #e9eaec;
      }

      #container h3 {
        color: #292d32;
        font-size: 15px;
        font-weight: 650;
      }

      #left,
      #right {
        vertical-align: top;
        display: inline-block;
      }

      #left {
        width: 52%;
      }

      #right {
        width: 46%;
      }

      .way {
        display: grid;
        grid-template-columns: 16px minmax(0, 6.5em) minmax(20px, 1fr) minmax(0, 13em);
        align-items: center;
        gap: 0.35em;
        width: min(100%, 25em);
        height: 36px;
      }

      .way img {
        vertical-align: middle;
      }

      .way select {
        width: 100%;
        min-width: 0;
      }

      .way .direction {
        text-align: center;
      }

      #builtin-site-picker {
        display: flex;
        align-items: center;
        gap: 0.35em;
        width: min(22em, 98%);
        margin: 8px 0 0 2%;
      }

      #builtin-site-picker[hidden] {
        display: none;
      }

      #builtin-site-picker select {
        min-width: 0;
        flex: 1;
      }

      .from {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #key {
        min-width: 3.5em;
      }

      #container select,
      #addsite input,
      #add-builtin,
      #site_add,
      .usersite .delete {
        box-sizing: border-box;
        height: 30px;
        border: 1px solid #c2c7cb;
        border-radius: 6px;
        background: #ffffff;
        color: #292d32;
        font: 14px system-ui, sans-serif;
        transition: border-color 0.15s, background-color 0.15s, box-shadow 0.15s;
      }

      #container select,
      #addsite input {
        height: 32px;
        padding: 0 10px;
      }

      #container select:hover,
      #addsite input:hover {
        border-color: #899199;
      }

      #addsite input::placeholder {
        color: #858b91;
      }

      #add-builtin,
      #site_add,
      .usersite .delete {
        cursor: pointer;
        background: #f0f1f2;
        color: #383e44;
        border-color: #c2c7cb;
      }

      #add-builtin:hover,
      #site_add:hover {
        background: #e3e5e7;
        border-color: #9299a0;
      }

      .usersite .delete:hover {
        background: #f8eeee;
        border-color: #c9a8a8;
      }

      #container select:focus-visible,
      #addsite input:focus-visible,
      #add-builtin:focus-visible,
      #site_add:focus-visible,
      .usersite .delete:focus-visible,
      #save:focus-visible {
        outline: 2px solid #535b63;
        outline-offset: 2px;
      }

      #container select:focus-visible,
      #addsite input:focus-visible {
        border-color: #535b63;
        box-shadow: 0 0 0 3px #e9ebed;
      }

      #add-builtin {
        flex: none;
        width: 32px;
        height: 32px;
        padding: 0;
        font-size: 19px;
        line-height: 1;
      }

      #container h2 {
        margin: 0 auto;
        width: 100%;
        font-size: x-large;
        text-align: center;
        position: relative;
      }

      #ver {
        font-size: small;
        position: absolute;
        bottom: 0;
        right: 0;
        color: #535b63;
      }

      #usersites {
        margin-left: 2%;
      }

      #addsite {
        max-width: 27em;
      }

      #addsite .tip {
        display: block;
        line-height: 1.4;
        margin: 8px 0 4px;
        color: #646b72;
        font-size: 13px;
      }

      #addsite input {
        display: block;
        width: 100%;
      }

      #site_add {
        padding: 0 12px;
        margin-top: 12px;
        height: 32px;
        font-weight: 600;
      }

      .usersite {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        width: min(22em, 98%);
      }

      .usersite .icon {
        flex: none;
        margin-left: 6px;
      }

      .usersite:hover {
        background-color: #f2f3f4;
        border-radius: 4px;
      }

      .usersite .name {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .usersite .delete {
        flex: none;
        margin-left: auto;
        opacity: 0;
        width: 26px;
        height: 26px;
        padding: 4px;
        background: #ffffff;
        border-color: #d0d4d8;
      }

      .usersite .delete img {
        display: block;
      }

      .usersite:hover .delete,
      .usersite:focus-within .delete {
        opacity: 1;
      }

      .radio-container {
        position: relative;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        box-sizing: border-box;
        width: min(100%, 19rem);
        min-height: 32px;
        padding-right: 44px;
      }

      .radio-container input[type='radio'] {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }

      .radio-container label {
        position: relative;
        align-self: stretch;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        margin-left: -1px;
        padding: 5px 6px;
        border: 1px solid #c2c7cb;
        background: #ffffff;
        color: #646b72;
        font-size: 13px;
        text-align: center;
        overflow-wrap: anywhere;
        cursor: pointer;
      }

      #nativeicon + label {
        margin-left: 0;
        border-radius: 6px 0 0 6px;
      }

      #maskicon + label {
        border-radius: 0 6px 6px 0;
      }

      .radio-container input[type='radio']:checked + label {
        z-index: 1;
        border-color: #666e76;
        background: #e6e8ea;
        color: #292d32;
      }

      .radio-container input[type='radio']:focus-visible + label {
        z-index: 2;
        outline: 2px solid #535b63;
        outline-offset: 2px;
      }

      .image-container {
        position: absolute;
        top: 50%;
        right: 0;
        transform: translateY(-50%);
        width: 32px;
        height: 32px;
      }

      .image-container img,
      .image-container canvas {
        display: none;
        width: 100%;
        height: 100%;
      }

      #badge-setting {
        display: block;
        margin-top: 12px;
      }

      #container input[type='checkbox'],
      #container input[type='radio'] {
        accent-color: #535b63;
        vertical-align: middle;
      }

      @media (max-width: 900px) {
        #left,
        #right {
          display: block;
          width: 100%;
        }

        #right {
          max-width: 30em;
        }
      }

      @media (max-width: 600px) {
        .way {
          grid-template-columns: 16px minmax(0, 5em) minmax(18px, 1fr) minmax(0, 13em);
          gap: 4px;
        }
      }

      @media (max-width: 400px) {
        #container {
          margin: 12px auto;
          padding: 16px;
        }

        #ver {
          position: static;
          display: block;
        }
      }

      #nativeicon:checked ~ .image-container #native-icon,
      #overlapicon:checked ~ .image-container #overlap-icon,
      #maskicon:checked ~ .image-container #mask-icon {
        display: block;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <h2>
        <label class="i18n">__MSG_optionMessage__</label>
        <a id="ver" href="https://github.com/niu541412/easy_switch" target="_blank"></a>
      </h2>
      <hr />

      <div id="left">
        <h3 class="i18n" style="margin-top: 30px">__MSG_iconStyle__</h3>
        <div class="radio-container">
          <input type="radio" name="button" id="nativeicon" value="0" />
          <label class="i18n" for="nativeicon">__MSG_iconNative__</label>
          <input type="radio" name="button" id="overlapicon" value="1" />
          <label class="i18n" for="overlapicon">__MSG_iconNested__</label>
          <input type="radio" name="button" id="maskicon" value="2" />
          <label class="i18n" for="maskicon">__MSG_iconMasked__</label>
          <div class="image-container">
            <img id="native-icon" alt="Native Icon" />
            <canvas id="overlap-icon" width="32" height="32" alt="Overlap Icon"></canvas>
            <canvas id="mask-icon" width="32" height="32" alt="Mask Icon"></canvas>
          </div>
        </div>
        <label id="badge-setting">
          <input id="showBadgeText" type="checkbox" />
          <span class="i18n">__MSG_showBadgeText__</span>
        </label>

        <h3 class="i18n" style="margin-top: 24px">__MSG_sitesAdded__</h3>
        <div id="usersites"></div>
        <div id="builtin-site-picker" hidden>
          <select id="inactive-builtin-sites" aria-label="__MSG_addBuiltinSite__" class="i18n"></select>
          <button id="add-builtin" class="i18n" title="__MSG_addBuiltinSite__" aria-label="__MSG_addBuiltinSite__" type="button">+</button>
        </div>

        <h3 class="i18n" style="margin-top: 10px">__MSG_addSite__</h3>
        <div id="addsite">
          <span class="tip i18n">__MSG_nameMessage__</span>
          <input class="i18n" id="site_name" type="text" placeholder="__MSG_siteNameExample__" />
          <span class="tip i18n">__MSG_siteHomepage__</span>
          <input
            class="i18n"
            id="site_home"
            type="text"
            placeholder="__MSG_example__https://example.com"
            title="__MSG_tip1__"
          />
          <span class="tip i18n">__MSG_searchURL__</span>
          <input
            class="i18n"
            id="site_searchurl"
            type="text"
            placeholder="__MSG_example__https://example.com/search?q=%s"
            title="__MSG_tip2__"
          />
          <button id="site_add" class="i18n">__MSG_successAdd__</button>
          <span class="add-tip"></span>
        </div>
      </div>

      <div id="right">
        <h3 class="i18n" style="margin-top: 30px">__MSG_shortcut__</h3>
        <input id="useshortcut" type="checkbox" />
        <label class="i18n" for="useshortcut">__MSG_enableShortcut__</label>
        <br /><br />
        <label><input id="ctrl" type="checkbox" />Ctrl</label>+
        <label><input id="alt" type="checkbox" />Alt</label>+
        <label><input id="shift" type="checkbox" />Shift</label>+
        <select id="key" name="key">
          <option value="a">A</option>
          <option value="b">B</option>
          <option value="c">C</option>
          <option value="d">D</option>
          <option value="e">E</option>
          <option value="f">F</option>
          <option value="g">G</option>
          <option value="h">H</option>
          <option value="i">I</option>
          <option value="j">J</option>
          <option value="k">K</option>
          <option value="l">L</option>
          <option value="m">M</option>
          <option value="n">N</option>
          <option value="o">O</option>
          <option value="p">P</option>
          <option value="q">Q</option>
          <option value="r">R</option>
          <option value="s" selected="selected">S</option>
          <option value="t">T</option>
          <option value="u">U</option>
          <option value="v">V</option>
          <option value="w">W</option>
          <option value="x">X</option>
          <option value="y">Y</option>
          <option value="z">Z</option>
        </select>

        <h3 class="i18n" style="margin-top: 20px">__MSG_newTab__</h3>
        <input id="newtab" class="i18n" type="checkbox" />
        <label class="i18n" for="newtab">__MSG_yesMessage__</label>

        <h3 class="i18n" style="margin-top: 24px">__MSG_switchSetting__</h3>
        <div id="ways"></div>
      </div>
    </div>
    <button id="save" class="i18n">__MSG_saveMessage__</button>

    <script src="js/browser-target.js"></script>
    <script src="js/environment.js"></script>
    <script src="js/favicon.js"></script>
    <script src="js/options.js"></script>
  </body>
</html>
